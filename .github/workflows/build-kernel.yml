name: Build Xiaomi 11T Pro Custom Kernel

on:
  workflow_dispatch:

env:
  KERNEL_REPO: "Xiaomi-SM8350/android_kernel_xiaomi_sm8350"
  KERNEL_BRANCH: "lineage-21"
  KERNEL_DEFCONFIG: "vili_defconfig"
  ANYKERNEL_REPO: "frenkymahn/vili-kernel-builder"
  ANYKERNEL_BRANCH: "master"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev

      - name: Download Clang Compiler & Toolchains
        run: |
          mkdir -p $GITHUB_WORKSPACE/tc
          cd $GITHUB_WORKSPACE/tc
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b main clang

      - name: Clone Kernel Source & Integrate KernelSU
        run: |
          git clone https://github.com/${{ env.KERNEL_REPO }} -b ${{ env.KERNEL_BRANCH }} android_kernel --depth=1
          cd android_kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel Image
        run: |
          cd android_kernel
          
          export PATH="$GITHUB_WORKSPACE/tc/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CC=clang
          
          make O=out ${{ env.KERNEL_DEFCONFIG }}
          
          # ആവശ്യമായ BPF, XATTR, KernelSU കോൺഫിഗറേഷനുകൾ ഇവിടെ ഉറപ്പുവരുത്തുന്നു
          echo "CONFIG_TMPFS_XATTR=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_BPF=y" >> out/.config
          echo "CONFIG_BPF_SYSCALL=y" >> out/.config
          echo "CONFIG_NET_CLS_ACT=y" >> out/.config
          
          make O=out olddefconfig
          
          make -j$(nproc --all) O=out \
               CC=clang \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
               LOCALVERSION="-DARK-kernel"

      - name: Verify Kernel Output
        run: |
          if [ -f android_kernel/out/arch/arm64/boot/Image ]; then
              echo "KERNEL_IMAGE=Image" >> $GITHUB_ENV
          elif [ -f android_kernel/out/arch/arm64/boot/Image.gz ]; then
              echo "KERNEL_IMAGE=Image.gz" >> $GITHUB_ENV
          else
              echo "Build Failed: Kernel output image not found!" && exit 1
          fi

      - name: Clone AnyKernel3 Template
        run: |
          git clone https://github.com/${{ env.ANYKERNEL_REPO }} -b ${{ env.ANYKERNEL_BRANCH }} AnyKernel3

      - name: Update AnyKernel Info for Builder & Kernel
        run: |
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=DARK-kernel by FrenkyMahn/g' anykernel.sh || echo "kernel.string=DARK-kernel by FrenkyMahn" >> anykernel.sh

      - name: Package Kernel Flashable Zip
        run: |
          cp android_kernel/out/arch/arm64/boot/${{ env.KERNEL_IMAGE }} AnyKernel3/
          cd AnyKernel3
          zip -r9 ../DARK-kernel-Vili.zip * -x .git* README.md

      - name: Upload Flashable Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: DARK-kernel-Vili
          path: DARK-kernel-Vili.zip

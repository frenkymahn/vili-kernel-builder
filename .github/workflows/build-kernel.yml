name: Build Xiaomi 11T Pro Kernel

on:
  workflow_dispatch: # Allows manual trigger via the GitHub Action tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Builder
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.1-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libjansson-dev libelf-dev

    - name: Download Clang Toolchain
      run: |
        mkdir clang
        cd clang
        # Using a modern AOSP Clang toolchain
        wget https://googlesource.com
        tar -xf clang-r522817.tar.gz

    - name: Clone Kernel Source
      run: |
        # Replace the URL/branch below with your target Android version branch
        git clone --depth=1 https://github.com -b 14.0 kernel-source
        
    - name: Build Kernel Binary
      run: |
        export PATH=$(pwd)/clang/bin:$PATH
        cd kernel-source
        
        # Build Environment Variables
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
        export CC=clang
        
        # Generate configuration from defconfig
        make O=out vili_defconfig
        
        # Compile
        make -j$(nproc --all) O=out

    - name: Package with AnyKernel3
      run: |
        git clone https://github.com{{ github.repository_owner }}/AnyKernel3.git anykernel
        # Copy the compiled Image to AnyKernel directory
        cp kernel-source/out/arch/arm64/boot/Image anykernel/
        # Also copy dtbo.img if your source tree generates it separately
        if [ -f kernel-source/out/arch/arm64/boot/dtbo.img ]; then cp kernel-source/out/arch/arm64/boot/dtbo.img anykernel/; fi
        
        cd anykernel
        zip -r9 ../vili-kernel-custom.zip * -x .git* README.md

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Xiaomi-11T-Pro-Kernel-Zip
        path: vili-kernel-custom.zip
        

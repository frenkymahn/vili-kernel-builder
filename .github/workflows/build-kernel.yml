name: Build Xiaomi 11T Pro Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Install Build Dependencies & GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-arm-linux-gnueabi gcc-arm-linux-gnueabi git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libelf-dev wget curl unzip

      - name: Download Working Kernel Source & Integrate KernelSU
        run: |
          mkdir -p $GITHUB_WORKSPACE/android_kernel
          cd $GITHUB_WORKSPACE
          
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git android_kernel || \
          git clone --depth=1 https://github.com/PixelExperience-Devices/kernel_xiaomi_sm8350.git android_kernel
          
          cd android_kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel Image with GCC
        run: |
          cd android_kernel
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          make O=out vili_defconfig || make O=out vendor/vili_defconfig
          
          echo "CONFIG_TMPFS_XATTR=y" >> out/.config
          echo "CONFIG_BPF=y" >> out/.config
          echo "CONFIG_BPF_SYSCALL=y" >> out/.config
          echo "CONFIG_NET_CLS_ACT=y" >> out/.config
          
          make O=out olddefconfig
          
          make -j$(nproc --all) O=out \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
               LOCALVERSION="-DARK-kernel"

      - name: Clone AnyKernel3 Template
        run: |
          git clone --depth=1 https://github.com/frenkymahn/vili-kernel-builder.git -b master AnyKernel3

      - name: Update AnyKernel Info for Builder & Kernel
        run: |
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=DARK-kernel by FrenkyMahn/g' anykernel.sh || echo "kernel.string=DARK-kernel by FrenkyMahn" >> anykernel.sh

      - name: Package Kernel Flashable Zip
        run: |
          cd android_kernel
          
          cp out/arch/arm64/boot/Image ${{ github.workspace }}/AnyKernel3/
          
          if [ -f out/arch/arm64/boot/dtb ]; then
              cp out/arch/arm64/boot/dtb ${{ github.workspace }}/AnyKernel3/
          elif [ -f out/arch/arm64/boot/dts/xiaomi/vili.dtb ]; then
              cp out/arch/arm64/boot/dts/xiaomi/vili.dtb ${{ github.workspace }}/AnyKernel3/dtb
          fi
          
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
              cp out/arch/arm64/boot/dtbo.img ${{ github.workspace }}/AnyKernel3/
          fi
          
          cd ${{ github.workspace }}/AnyKernel3
          zip -r9 ../DARK-kernel-Vili.zip * -x .git* README.md

      - name: Upload Flashable Zip Package
        uses: actions/upload-artifact@v4
        with:
          name: DARK-kernel-Vili
          path: DARK-kernel-Vili.zip

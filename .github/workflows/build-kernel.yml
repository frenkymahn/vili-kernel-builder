name: Build Custom vili Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Builder
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Download Clang Toolchain
      run: |
        mkdir -p clang
        cd clang
        curl -L -o clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz || true
        tar -xzf clang.tar.gz || true

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 -b 14.0 https://github.com/frenkymahn/los-kernel_xiaomi_sm8350.git source

    - name: Inject BPF Configs
      run: |
        CONFIG_PATH="source/arch/arm64/configs/vendor/vili_defconfig"
        if [ ! -f "$CONFIG_PATH" ]; then
          CONFIG_PATH="source/kernel/configs/vendor/vili_defconfig"
        fi
        echo "Appending BPF configurations to $CONFIG_PATH"
        {
          echo "CONFIG_BPF=y"
          echo "CONFIG_BPF_SYSCALL=y"
          echo "CONFIG_NET_CLS_BPF=y"
          echo "CONFIG_NET_ACT_BPF=y"
          echo "CONFIG_BPF_JIT=y"
          echo "CONFIG_HAVE_EBPF_JIT=y"
          echo "CONFIG_BPF_STREAM_PARSER=y"
          echo "CONFIG_NET_SCH_INGRESS=y"
          echo "CONFIG_CGROUP_BPF=y"
          echo "CONFIG_TMPFS_XATTR=y"
        } >> "$CONFIG_PATH"

    - name: Compile Kernel
      run: |
        export PATH=$(pwd)/clang/bin:$PATH
        cd source
        make O=out ARCH=arm64 vendor/vili_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-

    - name: Package with AnyKernel3
      run: |
        git clone -b master https://github.com/frenkymahn/vili-kernel-builder.git anykernel
        if [ -f source/out/arch/arm64/boot/Image.gz-dtb ]; then
          cp source/out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
        elif [ -f source/out/arch/arm64/boot/Image.gz ]; then
          cp source/out/arch/arm64/boot/Image.gz anykernel/Image.gz
        fi
        if [ -f source/out/arch/arm64/boot/dtbo.img ]; then
          cp source/out/arch/arm64/boot/dtbo.img anykernel/dtbo.img
        fi
        cd anykernel
        zip -r9 ../vili-custom-kernel.zip * -x .git README.md

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vili-custom-kernel-zip
        path: vili-custom-kernel.zip
